# Daily refresh of Indigenous program static snapshots from About Grief.
# Also available as a manual "Run workflow" button under Actions.
name: Refresh Indigenous static data

on:
  schedule:
    # Every day at 14:00 UTC (10:00 AM Eastern / 9:00 AM ET in summer)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh fragments from About Grief
        run: node refresh-indigenous-static.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indigenous-fragments indigenous-programs-manifest.json
          if git diff --staged --quiet; then
            echo "No changes — static data already up to date."
            exit 0
          fi
          git commit -m "chore: daily refresh of Indigenous program static snapshots"
          git push
